# 核心提示：GitHub 官方源需要基础代理开启后才能更新
# 建议在 Clash 设置中确保已配置节点信息

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - ⚡ 全部IEPL
      - 🌐 其他地区
      - DIRECT

  - name: 🚀 手动切换
    type: select
    include-all: true

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # ------------------------ 场景化分组 ------------------------
  - name: 📲 电报消息
    type: select
    proxies: [🚀 节点选择, 🇭🇰 香港节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, ♻️ 自动选择]

  - name: 💬 OpenAi
    type: select
    proxies: [🇺🇸 美国节点, 🇺🇸 美国IEPL, ⚡ 全部IEPL, 🇯🇵 日本节点, 🇸🇬 新加坡节点, ♻️ 自动选择]

  - name: 📹 油管视频
    type: select
    proxies: [🚀 节点选择, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇭🇰 香港节点, ♻️ 自动选择]

  - name: 🎥 奈飞视频
    type: select
    proxies: [🎥 奈飞节点, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🚀 节点选择]

  - name: 🎥 Tiktok
    type: select
    proxies: [🇺🇸 美国节点, 🇺🇸 美国IEPL, ⚡ 全部IEPL, 🇯🇵 日本节点, 🇰🇷 韩国节点]

  - name: 📺 巴哈姆特
    type: select
    proxies: [🇼🇸 台湾节点, 🇼🇸 台湾IEPL, 🚀 节点选择]

  - name: 📺 哔哩哔哩
    type: select
    proxies: [DIRECT, 🇭🇰 香港节点, 🇼🇸 台湾节点, ♻️ 自动选择]

  - name: 🌍 国外媒体
    type: select
    proxies: [🚀 节点选择, 🇭🇰 香港节点, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, ♻️ 自动选择]

  - name: 🌏 国内媒体
    type: select
    proxies: [DIRECT, 🇭🇰 香港节点, 🇼🇸 台湾节点, ♻️ 自动选择]

  - name: 📢 谷歌FCM
    type: select
    proxies: [DIRECT, 🚀 节点选择, 🇺🇸 美国节点, 🇭🇰 香港节点, ♻️ 自动选择]

  - name: Ⓜ️ 微软Bing
    type: select
    proxies: [🚀 节点选择, 🇺🇸 美国节点, 🇭🇰 香港节点, DIRECT]

  - name: Ⓜ️ 微软云盘
    type: select
    proxies: [DIRECT, 🚀 节点选择, 🇺🇸 美国节点, ♻️ 自动选择]

  - name: Ⓜ️ 微软服务
    type: select
    proxies: [DIRECT, 🚀 节点选择, 🇺🇸 美国节点, ♻️ 自动选择]

  - name: 🍎 苹果服务
    type: select
    proxies: [DIRECT, 🚀 节点选择, 🇺🇸 美国节点, ♻️ 自动选择]

  - name: 🎮 游戏平台
    type: select
    proxies: [DIRECT, ⚡ 全部IEPL, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🚀 节点选择]

  - name: 🎶 网易音乐
    type: select
    proxies: [DIRECT, ♻️ 自动选择]

  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT, 🚀 节点选择]

  - name: 🛑 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

  - name: 🍃 应用净化
    type: select
    proxies: [REJECT, DIRECT]

  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, DIRECT]

  # ------------------------ 动态节点分组 ------------------------
  - name: 🇭🇰 香港节点
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*(港|HK|hk|Hong Kong|HongKong|hongkong|深港)).*$"
    interval: 300
  - name: 🇼🇸 台湾节点
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*(台|新北|彰化|TW|Taiwan)).*$"
    interval: 300
  - name: 🇺🇸 美国节点
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*(美|US|United States)).*$"
    interval: 300
  - name: 🇯🇵 日本节点
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*(日本|川日|东京|大阪|JP|Japan)).*$"
    interval: 300
  - name: 🇸🇬 新加坡节点
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*(新加坡|坡|狮城|SG|Singapore)).*$"
    interval: 300
  - name: 🇰🇷 韩国节点
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*(KR|Korea|KOR|首尔|韩)).*$"
    interval: 300
  - name: 🇬🇧 英国节点
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*(英国|Britain|United Kingdom|London)).*$"
    interval: 300
  - name: 🇮🇳 印度节点
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*(印度|IN)).*$"
    interval: 300
  - name: 🇭🇰 香港IEPL
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*IEPL)(?=.*(港|HK|Hong)).*$"
    interval: 300
  - name: 🇼🇸 台湾IEPL
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*IEPL)(?=.*(台|TW|Taiwan)).*$"
    interval: 300
  - name: 🇺🇸 美国IEPL
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*IEPL)(?=.*(美|US|United States)).*$"
    interval: 300
  - name: ⚡ 全部IEPL
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*0\\.5)(?=.*IEPL).*$"
    interval: 300
  - name: ⚡ 0.5倍
    type: url-test
    include-all: true
    filter: "(?i)0\\.5倍|0\\.5x|0\\.5X|半速|half"
    interval: 300
  - name: 🌐 其他地区
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*(0\\.5|印度|港|HK|美|US|日本|JP|新加坡|SG|台|TW|KR|韩|英国|IEPL)).*$"
    interval: 300
  - name: 🎥 奈飞节点
    type: select
    include-all: true
    filter: "(?i)NF|奈飞|解锁|Netflix|NETFLIX|Media"

