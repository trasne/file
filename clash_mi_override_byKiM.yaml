proxy-groups:
  # ==============================
  # 核心策略组
  # ==============================
  
  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
    name: 🚀 手动选择
    type: select
    proxies:
      - ♻️ 自动选择
      - ⚡ 全部IEPL
      - 🇭🇰 香港节点
      - 🇭🇰 香港IEPL
      - 🇼🇸 台湾节点
      - 🇼🇸 台湾IEPL
      - 🇺🇸 美国节点
      - 🇺🇸 美国IEPL
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - ⚡ 0.5倍
    # 包含所有可用节点
    include-all: true
    exclude-filter: "(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置"

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Urltest.png
    name: ♻️ 自动选择
    type: url-test
    interval: 300
    tolerance: 50
    include-all: true
    # 排除: 流量重置提示, 0.5倍率节点(这些去专用组)
    exclude-filter: "(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|0\\.5|half|半速"

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Direct.png
    name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Final.png
