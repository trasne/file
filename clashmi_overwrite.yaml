proxy-groups:
  

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/HK.png
    name: 🇭🇰 香港节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: ^(?!.*0\.5)(?=.*(?:港|HK|hk|Hong ?Kong|hongkong|深港)).*$
    include-all: true

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/TW.png
    name: 🇼🇸 台湾节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: ^(?!.*0\.5x)(?=.*(?:台|新北|彰化|TW|Taiwan)).*$
    include-all: true

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/US.png
    name: 🇺🇸 美国节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: ^(?!.*0\.5)(?=.*(?:美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|UnitedStates)).*$
    include-all: true

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/JP.png
    name: 🇯🇵 日本节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: ^(?!.*0\.5)(?=.*(?:日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼|-)日|JP|Japan|🇯🇵)).*$
    include-all: true

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/SG.png
    name: 🇸🇬 新加坡节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: ^(?!.*0\.5)(?=.*(?:新加坡|坡|狮城|SG|Singapore)).*$
    include-all: true

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/KR.png
    name: 🇰🇷 韩国节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: ^(?!.*0\.5)(?=.*(?:KR|Korea|KOR|首尔|韩|韓)).*$
    include-all: true

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/UK.png
    name: 🇬🇧 英国节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: ^(?!.*0\.5)(?=.*(?:英国|Britain|United Kingdom|England|伦敦)).*$
    include-all: true

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/IN.png
    name: 🇮🇳 印度节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: ^(?!.*0\.5)(?=.*(?:印度|IN)).*$
    include-all: true

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/HK.png
    name: 🇭🇰 香港IEPL
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: (?i)(?=.*IEPL)(?=.*(?:港|HK|Hong|深港)).*$
    include-all: true

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/TW.png
    name: 🇼🇸 台湾IEPL
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: (?i)(?=.*IEPL)(?=.*(?:台|TW|Taiwan|彰化|新北)).*$
    include-all: true

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/US.png
    name: 🇺🇸 美国IEPL
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: (?i)(?=.*IEPL)(?=.*(?:美|US|United States|UnitedStates)).*$
    include-all: true

  - icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/IEPL.png
