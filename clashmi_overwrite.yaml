# -------------------------------------------------------------------
# Custom_Clash_Meta_Rules for Android (Mihomo Core)
# 基于 Aethersailor 模板转换
# -------------------------------------------------------------------

# 规则集定义 (Rule Providers)
rule-providers:
  Custom_Direct_Domain:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml"
    path: ./ruleset/custom_direct_domain.yaml
    interval: 86400

  Custom_Direct_IP:
    type: http
    behavior: classical
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml"
    path: ./ruleset/custom_direct_ip.yaml
    interval: 86400

  Custom_Proxy_Domain:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml"
    path: ./ruleset/custom_proxy_domain.yaml
    interval: 86400

  Custom_Proxy_IP:
    type: http
    behavior: classical
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml"
    path: ./ruleset/custom_proxy_ip.yaml
    interval: 86400

  Steam_CDN:
    type: http
    behavior: classical
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical.yaml"
    path: ./ruleset/steam_cdn.yaml
    interval: 86400

  Custom_Port_Direct:
    type: http
    behavior: classical
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml"
    path: ./ruleset/port_direct.yaml
    interval: 86400

# 策略组 (Proxy Groups)
proxy-groups:
  # 1. 基础选择
  - name: 🚀 手动选择
    type: select
    proxies: [♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🇼🇸 台湾节点, 🇰🇷 韩国节点, 🇬🇧 英国节点, ⚡ 全部IEPL, 🌐 其他地区, DIRECT]

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    # 排除 0.5/half 等倍率节点
    filter: "^(?!.*(?:0\.5|half|半速)).*$"
    include-all: true

  # 2. 地区分类 (Meta 核心通过 filter 自动筛选节点)
  - name: 🇭🇰 香港节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: "^(?!.*0\.5)(?=.*(?:港|HK|hk|Hong ?Kong|hongkong|深港)).*$"
    include-all: true

  - name: 🇯🇵 日本节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: "^(?!.*0\.5)(?=.*(?:日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼|-)日|JP|Japan|🇯🇵)).*$"
    include-all: true

  - name: 🇺🇸 美国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: "^(?!.*0\.5)(?=.*(?:美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|UnitedStates)).*$"
    include-all: true

  - name: 🇸🇬 新加坡节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: "^(?!.*0\.5)(?=.*(?:新加坡|坡|狮城|SG|Singapore)).*$"
    include-all: true

  - name: 🇼🇸 台湾节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: "^(?!.*0\.5x)(?=.*(?:台|新北|彰化|TW|Taiwan)).*$"
    include-all: true

  - name: ⚡ 全部IEPL
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: "(?i)IEPL"
    include-all: true

  # 3. 业务逻辑分组 (简化示例，可根据需要增删)
  - name: 💬 即时通讯
    type: select
    proxies: [♻️ 自动选择, 🇭🇰 香港节点, 🇸🇬 新加坡节点, 🇯🇵 日本节点, 🇺🇸 美国节点, 🚀 手动选择]

  - name: 🤖 ChatGPT
    type: select
    proxies: [🇼🇸 台湾节点, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🚀 手动选择]

  - name: 📹 YouTube
    type: select
    proxies: [🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇸 美国节点, ♻️ 自动选择]

  - name: 🎥 Netflix
    type: select
    proxies: [🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点]

  - name: 🎮 Steam
    type: select
    proxies: [DIRECT, 🚀 手动选择, ♻️ 自动选择]

  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 手动选择, 🇭🇰 香港节点, 🇺🇸 美国节点, DIRECT]

  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT]

  - name: 🌐 其他地区
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    # 正则取反，排除常见主流地区
    filter: "^(?!.*(印度|IN|港|HK|hk|Hong Kong|HongKong|hongkong|深港|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|UnitedStates|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼|-)日|JP|Japan|🇯🇵|新加坡|坡|狮城|SG|Singapore|台|新北|彰化|TW|Taiwan|KR|Korea|KOR|首尔|韩|韓)).*$"
    include-all: true

# 规则逻辑 (Rules)
rules:
  # 本地与私有网络直连
  - GEOSITE,private,🎯 全球直连
  - GEOIP,private,🎯 全球直连,no-resolve

  # 本项目自定义规则
  - RULE-SET,Custom_Direct_Domain,🎯 全球直连
  - RULE-SET,Custom_Direct_IP,🎯 全球直连
  - RULE-SET,Custom_Proxy_Domain,🚀 手动选择
  - RULE-SET,Custom_Proxy_IP,🚀 手动选择

  # 业务分类分流
  - GEOSITE,google-cn,🎯 全球直连
  - GEOSITE,category-games@cn,🎯 全球直连
  - RULE-SET,Steam_CDN,🎯 全球直连
  - GEOSITE,category-game-platforms-download,🎯 全球直连
  
  - GEOSITE,openai,🤖 ChatGPT
  - GEOSITE,category-communication,💬 即时通讯
  - GEOSITE,youtube,📹 YouTube
  - GEOSITE,netflix,🎥 Netflix
  - GEOSITE,steam,🎮 Steam
  
  # 基础服务分流
  - GEOSITE,google,🚀 手动选择
  - GEOSITE,github,🚀 手动选择
  - GEOSITE,apple,🎯 全球直连
  - GEOSITE,microsoft,🎯 全球直连

  # 兜底规则
  - GEOSITE,cn,🎯 全球直连
  - GEOIP,cn,🎯 全球直连,no-resolve
  - RULE-SET,Custom_Port_Direct,🎯 全球直连
  - MATCH,🐟 漏网之鱼
