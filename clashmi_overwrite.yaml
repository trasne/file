# ----------------------------------------------------------------进阶覆写模板
# 说明：此模板会自动调整策略组顺序，解决 "not found" 报错，并增加图标美化。

# 1. 基础配置覆写
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
ipv6: false

# 2. 策略组覆写 (关键：在此处重新定义顺序)
# 将底层地区组放在前面，功能组放在后面引用
proxy-groups:
  # --- 基础地区组 (底层) ---
  - name: 🇭🇰 香港节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)港|HK|Hong|深港"

  - name: 🇯🇵 日本节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)日|JP|Japan|东京|大阪"

  - name: 🇺🇸 美国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)美|US|States|洛杉矶|圣何塞"

  - name: 🇼🇸 台湾节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)台|TW|Taiwan"

  - name: 🇸🇬 新加坡节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)新|坡|SG|Singapore"

  # --- 功能控制组 (引用上面的组) ---
  - name: 🚀 手动选择
    type: select
    proxies:
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
      - 🇼🇸 台湾节点
      - 🇸🇬 新加坡节点
      - DIRECT

  - name: 🤖 ChatGPT
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇼🇸 台湾节点
      - 🚀 手动选择

  - name: 📹 YouTube
    type: select
    proxies:
      - 🚀 手动选择
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 手动选择
      - DIRECT

# 3. 规则覆写 (强行插入到最前面)
rules:
  - DOMAIN-SUFFIX,openai.com,🤖 ChatGPT
  - DOMAIN-SUFFIX,chatgpt.com,🤖 ChatGPT
  - DOMAIN-SUFFIX,youtube.com,📹 YouTube
  - DOMAIN-SUFFIX,googlevideo.com,📹 YouTube
  - GEOIP,CN,DIRECT
  - MATCH,🐟 漏网之鱼
