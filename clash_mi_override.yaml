# 不要随意改变关键字，否则会导致出错
# acl4SSR规则

# 去广告：支持
# 自动测速：支持
# 微软分流：支持
# 苹果分流：支持
# 增强中国IP段：支持
# 增强国外GFW：支持
# 增加Tiktok规则默认美国节点
#制作日期：2024-11-21
#更新日期：2023-03-19


proxy-groups:
  # 核心节点选择（总控）
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - 🇭🇰 香港IEPL
      - 🇼🇸 台湾IEPL
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - ⚡ 0.5倍
      - 🌐 其他地区
      - DIRECT

  # 手动精细化切换（全节点列表）
  - name: 🚀 手动切换
    type: select
    include-all: true
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - 🇭🇰 香港IEPL
      - 🇼🇸 台湾IEPL
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - ⚡ 0.5倍
      - 🌐 其他地区
      - DIRECT

  # 自动测速选择（优先优质节点）
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇭🇰 香港IEPL
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - 🇼🇸 台湾IEPL
      - ⚡ 0.5倍
      - 🌐 其他地区

  # ------------------------ 场景化分组 ------------------------
  # 电报（优先香港/新加坡/美国IEPL，低延迟）
  - name: 📲 电报消息
    type: select
    proxies:
      - 🇭🇰 香港节点
      - 🇸🇬 新加坡节点
      - 🇺🇸 美国节点
      - 🇭🇰 香港IEPL
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - 🇯🇵 日本节点
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - ⚡ 0.5倍
      - 🌐 其他地区
      - ♻️ 自动选择
      - DIRECT

  # OpenAI（优先美国节点/美国IEPL）
  - name: 💬 OpenAi
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - 🇭🇰 香港节点
      - 🇸🇬 新加坡节点
      - 🇯🇵 日本节点
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - ⚡ 0.5倍
      - 🌐 其他地区
      - ♻️ 自动选择
      - DIRECT

  # 油管（优先美国/日本/香港IEPL，高带宽）
  - name: 📹 油管视频
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇭🇰 香港节点
      - 🇺🇸 美国IEPL
      - 🇭🇰 香港IEPL
      - ⚡ 全部IEPL
      - 🇸🇬 新加坡节点
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - ⚡ 0.5倍
      - 🌐 其他地区
      - ♻️ 自动选择
      - DIRECT

  # 奈飞（优先美国/日本/新加坡，适配奈飞版权）
  - name: 🎥 奈飞视频
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - 🇭🇰 香港节点
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - ⚡ 0.5倍
      - 🌐 其他地区
      - ♻️ 自动选择
      - DIRECT

  # Tiktok（强制美国节点，适配地域限制）
  - name: 🎥 Tiktok
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🌐 其他地区
      - ♻️ 自动选择

  # 巴哈姆特（优先台湾节点）
  - name: 📺 巴哈姆特
    type: select
    proxies:
      - 🇼🇸 台湾节点
      - 🇼🇸 台湾IEPL
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - ⚡ 全部IEPL
      - ♻️ 自动选择
      - DIRECT

  # 哔哩哔哩（优先直连，次选台湾/香港）
  - name: 📺 哔哩哔哩
    type: select
    proxies:
      - DIRECT
      - 🇭🇰 香港节点
      - 🇼🇸 台湾节点
      - ♻️ 自动选择
      - 🇯🇵 日本节点
      - ⚡ 0.5倍

  # 国外媒体（综合外网媒体，优先香港/美国/日本）
  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇭🇰 香港IEPL
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - ⚡ 0.5倍
      - 🌐 其他地区
      - ♻️ 自动选择
      - DIRECT

  # 国内媒体（优先直连，次选香港/台湾）
  - name: 🌏 国内媒体
    type: select
    proxies:
      - DIRECT
      - 🇭🇰 香港节点
      - 🇼🇸 台湾节点
      - 🇸🇬 新加坡节点
      - 🇯🇵 日本节点
      - ♻️ 自动选择
      - ⚡ 0.5倍
      - 🌐 其他地区

  # 谷歌FCM（优先直连，次选美国/香港）
  - name: 📢 谷歌FCM
    type: select
    proxies:
      - DIRECT
      - 🇺🇸 美国节点
      - 🇭🇰 香港节点
      - 🇺🇸 美国IEPL
      - 🇭🇰 香港IEPL
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - ⚡ 全部IEPL
      - ⚡ 0.5倍
      - ♻️ 自动选择

  # 微软Bing（优先选美国/香港）
  - name: Ⓜ️ 微软Bing
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇼🇸 台湾节点
      - 🇸🇬 新加坡节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - 🇭🇰 香港节点
      - ♻️ 自动选择
      - DIRECT

  # 微软云盘（优先直连，次选美国/香港）
  - name: Ⓜ️ 微软云盘
    type: select
    proxies:
      - DIRECT
      - ♻️ 自动选择
      - 🇺🇸 美国节点
      - 🇭🇰 香港节点
      - 🇸🇬 新加坡节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - ⚡ 0.5倍

  # 微软服务（优先节点选择，次选直连/美国）
  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - 🇺🇸 美国节点
      - DIRECT
      - 🇭🇰 香港节点
      - 🇸🇬 新加坡节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - ⚡ 0.5倍
      - ♻️ 自动选择

  # 苹果服务（优先直连，次选美国/香港）
  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🇺🇸 美国节点
      - 🇭🇰 香港节点
      - 🇸🇬 新加坡节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - ⚡ 0.5倍
      - ♻️ 自动选择

  # 游戏平台（优先IEPL/低延迟节点，次选直连）
  - name: 🎮 游戏平台
    type: select
    proxies:
      - ⚡ 全部IEPL
      - 🇭🇰 香港IEPL
      - ♻️ 自动选择
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇸🇬 新加坡节点
      - 🇺🇸 美国IEPL
      - DIRECT
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇼🇸 台湾节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - ⚡ 0.5倍
      - 🌐 其他地区

  # 网易音乐（优先直连，次选自动选择）
  - name: 🎶 网易音乐
    type: select
    filter: (?i)网易|音乐|NetEase|Music
    proxies:
      - DIRECT
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇼🇸 台湾节点
      - 🇸🇬 新加坡节点
      - DIRECT

  # 全球直连（兜底直连）
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇸🇬 新加坡节点
      - 🇯🇵 日本节点
      - ⚡ 0.5倍

  # 广告拦截（优先拒绝）
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
      - ♻️ 自动选择

  # 应用净化（优先拒绝）
  - name: 🍃 应用净化
    type: select
    proxies:
      - REJECT
      - DIRECT
      - ♻️ 自动选择

  # 漏网之鱼（兜底代理）
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇭🇰 香港IEPL
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - ⚡ 0.5倍
      - 🌐 其他地区
      - ♻️ 自动选择
      - DIRECT

  - name: 🇭🇰 香港节点
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*(港|HK|hk|Hong Kong|HongKong|hongkong|深港)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🇼🇸 台湾节点
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*(台|新北|彰化|TW|Taiwan)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🇺🇸 美国节点
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|UnitedStates)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🇯🇵 日本节点
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼|-)日|JP|Japan|🇯🇵)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🇸🇬 新加坡节点
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*(新加坡|坡|狮城|SG|Singapore)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🇰🇷 韩国节点
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*(KR|Korea|KOR|首尔|韩|韓)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🇬🇧 英国节点
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*(英国|Britain|United Kingdom|England|伦敦)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🇮🇳 印度节点
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*(印度|IN)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🇭🇰 香港IEPL
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*IEPL)(?=.*(港|HK|Hong|深港)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🇼🇸 台湾IEPL
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*IEPL)(?=.*(台|TW|Taiwan|彰化|新北)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🇺🇸 美国IEPL
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*IEPL)(?=.*(美|US|United States|UnitedStates)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: ⚡ 全部IEPL
    include-all: true
    filter: (?i)^(?!.*0\.5)(?=.*IEPL).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: ⚡ 0.5倍
    include-all: true
    filter: (?i)0\.5倍|0\.5x|0\.5X|半速|half|0\.5倍速  # 修正0.5x转义+兼容大写X/倍速
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🌐 其他地区
    include-all: true
    filter: (?i)^(?!.*(0\.5|印度|IN|港|HK|hk|Hong Kong|HongKong|hongkong|深港|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|UnitedStates|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼|-)日|JP|Japan|🇯🇵|新加坡|坡|狮城|SG|Singapore|台|新北|彰化|TW|Taiwan|KR|Korea|KOR|首尔|韩|韓|英国|Britain|United Kingdom|England|伦敦|IEPL)).*$
    type: url-test
    interval: 300
    tolerance: 50
  - name: 🎥 奈飞节点
    include-all: true
    filter: (?i)NF|奈飞|解锁|Netflix|NETFLIX|Media
    type: select

