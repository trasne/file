# HTTP(S) 代理服务端口
port: 7890

# SOCKS5 代理服务端口
socks-port: 7891

# HTTP(S) 和 SOCKS4(A)/SOCKS5 代理服务共用一个端口
mixed-port: 7890

# 设置为 true 以允许来自其他 LAN IP 地址的连接
allow-lan: false

# Clash 路由工作模式
mode: rule

# 默认情况下, Clash 将日志打印到 STDOUT
log-level: info

# RESTful Web API 监听地址
external-controller: 127.0.0.1:9090

# DNS 服务设置
dns:
  enable: true
  listen: 0.0.0.0:53
  # ipv6: false
  default-nameserver:
    - 114.114.114.114
    - 8.8.8.8
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  nameserver:
    - 114.114.114.114
    - 8.8.8.8
    - tls://dns.rubyfish.cn:853
    - https://1.1.1.1/dns-query
  fallback:
    - tls://8.8.8.8:853
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  nameserver-policy:
    "geosite:cn":
      - 114.114.114.114
      - 223.5.5.5

proxy-providers:
  # 动态加载远程代理提供者，实际使用时会被订阅替换
  remote_proxies:
    type: http
    url: "https://example.com/proxies.yaml"  # 替换为实际订阅链接
    interval: 3600
    path: ./providers/remote.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

proxy-groups:
  # 手动选择组
  - name: 🚀 手动选择
    type: select
    proxies:
      - 🔄 自动选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - 🇭🇰 香港IEPL
      - 🇼🇸 台湾IEPL
      - ⚡ 全部IEPL
      - ⚡ 0.5倍
      - 🌐 其他地区
      - DIRECT
      - REJECT

  # 自动选择组
  - name: 🔄 自动选择
    type: url-test
    use:
      - remote_proxies
    filter: ^(?!.*(?:0\.5|half|半速)).*$
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # 地区分组
  - name: 🇭🇰 香港节点
    type: url-test
    use:
      - remote_proxies
    filter: ^(?!\.5)(?=.+(?:港|HK|hk|Hong ?Kong|hongkong|深港)).*$
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇺🇸 美国节点
    type: url-test
    use:
      - remote_proxies
    filter: ^(?!\.5)(?=.+(?:美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|UnitedStates)).*$
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇯🇵 日本节点
    type: url-test
    use:
      - remote_proxies
    filter: ^(?!\.5)(?=.+(?:日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼|-)日|JP|Japan|🇯🇵)).*$
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇸🇬 新加坡节点
    type: url-test
    use:
      - remote_proxies
    filter: ^(?!\.5)(?=.+(?:新加坡|坡|狮城|SG|Singapore)).*$
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇼🇸 台湾节点
    type: url-test
    use:
      - remote_proxies
    filter: ^(?!\.5x)(?=.+(?:台|新北|彰化|TW|Taiwan)).*$
    url: https://www.gstatic.com/generate_204
