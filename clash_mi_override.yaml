proxy-groups:
  # 核心分组
  - name: 🚀 手动选择
    type: select
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇼🇸 台湾节点
      - 🇰🇷 韩国节点
      - 🇬🇧 英国节点
      - 🇮🇳 印度节点
      - 🇭🇰 香港IEPL
      - 🇼🇸 台湾IEPL
      - 🇺🇸 美国IEPL
      - ⚡ 全部IEPL
      - ⚡ 0.5倍
      - 🌐 其他地区
