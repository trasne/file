# Clash Mi 覆写配置 - 全分组防DNS泄漏模板（适配原OpenClash规则）
# 核心规则：从上到下匹配，优先级递减
rules:
  # 本地地址/域名直连
  - GEOSITE,private,🎯 全球直连
  - GEOIP,private,no-resolve,🎯 全球直连
  # 自定义直连规则（远程拉取）
  - RULE-SET,https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,🎯 全球直连
  - RULE-SET,https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,🎯 全球直连
  # 自定义代理规则（远程拉取）
  - RULE-SET,https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,🚀 手动选择
  - RULE-SET,https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,🚀 手动选择
  # 谷歌CN直连
  - GEOSITE,google-cn,🎯 全球直连
  # 国内游戏域名直连
  - GEOSITE,category-games@cn,🎯 全球直连
  # Steam下载CDN直连
  - RULE-SET,https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical.yaml,🎯 全球直连
  # 游戏平台下载直连
  - GEOSITE,category-game-platforms-download,🎯 全球直连
  # BT Tracker直连
  - GEOSITE,category-public-tracker,🎯 全球直连
  # 即时通讯（Telegram/WhatsApp等）
  - GEOSITE,category-communication,💬 即时通讯
  # 社交媒体（Twitter/Facebook等）
  - GEOSITE,category-social-media-!cn,🌐 社交媒体
  # AI服务
  - GEOSITE,openai,🤖 ChatGPT
  - GEOSITE,bing,🤖 Copilot
  - GEOSITE,category-ai-!cn,🤖 AI服务
  # 开发者相关
  - GEOSITE,github,🚀 GitHub
  # 测速工具
  - GEOSITE,category-speedtest,🚀 测速工具
  # 平台/媒体类
  - GEOSITE,steam,🎮 Steam
  - GEOSITE,youtube,📹 YouTube
  - GEOSITE,apple-tvplus,🎥 AppleTV+
  - GEOSITE,apple,🍎 苹果服务
  - GEOSITE,microsoft,Ⓜ️ 微软服务
  - GEOSITE,googlefcm,📢 谷歌FCM
  - GEOSITE,google,🇬 谷歌服务
  - GEOSITE,tiktok,🎶 TikTok
  - GEOSITE,netflix,🎥 Netflix
  - GEOSITE,disney,🎥 DisneyPlus
  - GEOSITE,hbo,🎥 HBO
  - GEOSITE,primevideo,🎥 PrimeVideo
  - GEOSITE,category-emby,🎥 Emby
  - GEOSITE,spotify,🎻 Spotify
  - GEOSITE,bahamut,📺 Bahamut
  - GEOSITE,category-games,🎮 游戏平台
  - GEOSITE,category-entertainment,🌎 国外媒体
  - GEOSITE,category-ecommerce,🛒 国外电商
  # GFW列表代理
  - GEOSITE,gfw,🚀 手动选择
  # IP类规则（无解析）
  - GEOIP,telegram,no-resolve,💬 即时通讯
  - GEOIP,twitter,no-resolve,🌐 社交媒体
  - GEOIP,facebook,no-resolve,🌐 社交媒体
  - GEOIP,google,no-resolve,🇬 谷歌服务
  - GEOIP,netflix,no-resolve,🎥 Netflix
  # 国内兜底
  - GEOSITE,cn,🎯 全球直连
  - GEOIP,cn,no-resolve,🎯 全球直连
  # 非标端口直连
  - RULE-SET,https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,🔀 非标端口
  # 漏网之鱼
  - MATCH,🐟 漏网之鱼

# 节点分组配置（核心，匹配上面的规则分组名）
